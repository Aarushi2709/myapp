# Required metadata
sonar.projectKey=my-react-app
sonar.projectName=myapp
sonar.projectVersion=1.0

# Source code location
sonar.sources=src

# Tests folder location
sonar.tests=src

# Optional: Exclude files from analysis (e.g., node_modules)
sonar.exclusions=**/node_modules/**,**/build/**

# Set the language to JavaScript (for React apps)
sonar.language=js

# Optional: Use the following properties if using Jest for unit tests
sonar.javascript.lcov.reportPaths=coverage/lcov-report/index.html

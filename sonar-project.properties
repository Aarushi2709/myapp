# Required metadata
sonar.projectKey=myapp
sonar.projectName=myapp
sonar.projectVersion=1.0

# Source code location
sonar.sources=src

# Test files location
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx

# Optional: Exclude files from analysis (e.g., node_modules)
sonar.exclusions=**/node_modules/**, **/build/**

# Set the language to JavaScript (for React apps)
sonar.language=js

# Code coverage report (ensure this matches the output of your test suite)
sonar.javascript.lcov.reportPaths=coverage/lcov-report/lcov-report.json
